<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LuggageGo - Register</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-left">

        <div class="logo">
            🧳 <span>Luggage<span>Go</span></span>
        </div>

        <h1>Create Your<br>Customer Account</h1>

        <p>
            Register with LuggageGo and manage
            all your luggage transportation bookings.
        </p>

    </div>


    <div class="auth-right">

        <div class="auth-card register-card">

            <h2>Create Account</h2>

            <p class="subtitle">
                Customer registration
            </p>


            <form id="registerForm">

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter full name"
                    required
                >


                <label>Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="10 digit mobile number"
                    maxlength="10"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >


                <label>Address</label>

                <textarea
                    id="address"
                    placeholder="Enter address"
                    rows="3"
                    required
                ></textarea>


                <div class="two-column">

                    <div>

                        <label>Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required
                        >

                    </div>


                    <div>

                        <label>Confirm Password</label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required
                        >

                    </div>

                </div>


                <label class="check">

                    <input type="checkbox" id="terms" required>

                    I agree to the terms and conditions.

                </label>


                <button class="btn primary full">
                    CREATE ACCOUNT
                </button>


                <p id="registerMessage" class="message"></p>

            </form>


            <p class="register-link">

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

<script src="admin/driver/worker/support/css/js/register.js"></script>

</body>
</html>
